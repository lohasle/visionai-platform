events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream fiftyone_ui {
    server fiftyone:5151;
  }

  upstream visionai_backend {
    server backend:58080;
  }

  server {
    listen 8080;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /admin-api/ai-platform/workbench-sso/fiftyone {
      proxy_pass http://visionai_backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_visionai_fiftyone_auth {
      internal;
      proxy_pass http://visionai_backend/admin-api/ai-platform/workbench-sso/fiftyone/validate;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Original-URI $request_uri;
    }

    location / {
      auth_request /_visionai_fiftyone_auth;
      proxy_pass http://fiftyone_ui;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:48080 http://127.0.0.1:48080" always;
      add_header X-Frame-Options "" always;
    }
  }
}
