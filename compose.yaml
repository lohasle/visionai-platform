name: nimbus-framework-go

x-cvat-backend-env: &cvat-backend-env
  CVAT_POSTGRES_HOST: cvat-db
  CVAT_REDIS_INMEM_HOST: cvat-redis-inmem
  CVAT_REDIS_INMEM_PORT: 6379
  CVAT_REDIS_INMEM_PASSWORD: ""
  CVAT_REDIS_ONDISK_HOST: cvat-redis-ondisk
  CVAT_REDIS_ONDISK_PORT: 6666
  CVAT_LOG_IMPORT_ERRORS: "true"
  CVAT_ALLOW_STATIC_CACHE: "no"
  CVAT_NUM_PROXIES: 1
  CVAT_ANALYTICS: 0
  SMOKESCREEN_OPTS: ""
  DJANGO_LOG_SERVER_HOST: ""
  DJANGO_LOG_SERVER_PORT: 8282

x-cvat-worker: &cvat-worker
  image: cvat/server:v2.61.0
  restart: unless-stopped
  depends_on:
    cvat-db:
      condition: service_started
    cvat-redis-inmem:
      condition: service_started
    cvat-redis-ondisk:
      condition: service_started
  environment:
    <<: *cvat-backend-env
    NUMPROCS: 1
  volumes:
    - visionai-cvat-data:/home/django/data
    - visionai-cvat-keys:/home/django/keys
    - visionai-cvat-logs:/home/django/logs
  networks:
    - visionai-cvat
  healthcheck:
    test: ["CMD-SHELL", "pgrep -f 'manage.py rqworker' >/dev/null"]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 30s

x-visionai-app-env: &visionai-app-env
  NIMBUS_HTTP_ADDR: ":58080"
  NIMBUS_DB_DSN: "nimbus:nimbus_dev@tcp(mysql:3306)/nimbus_platform_go?charset=utf8mb4&parseTime=True&loc=Local"
  NIMBUS_RABBITMQ_URL: "amqp://visionai:visionai_dev@rabbitmq:5672/"
  NIMBUS_EVENT_EXCHANGE: visionai.events
  NIMBUS_EVENT_QUEUE: visionai.domain-events.v1
  NIMBUS_S3_ENDPOINT: minio:9000
  NIMBUS_S3_PUBLIC_ENDPOINT: ${VISIONAI_PUBLIC_HOST:-localhost}:29000
  NIMBUS_S3_ACCESS_KEY: visionai
  NIMBUS_S3_SECRET_KEY: visionai_minio_dev
  NIMBUS_S3_BUCKET: visionai-assets
  NIMBUS_S3_SECURE: "false"
  NIMBUS_IMPORT_ROOT: /imports
  NIMBUS_CVAT_BASE_URL: http://cvat-gateway:8080
  NIMBUS_CVAT_PUBLIC_URL: http://${VISIONAI_PUBLIC_HOST:-localhost}:28080
  NIMBUS_CVAT_USERNAME: visionai
  NIMBUS_CVAT_PASSWORD: visionai_cvat_dev
  NIMBUS_TRAINING_WORK_ROOT: /training-work
  NIMBUS_DOCKER_BINARY: docker
  NIMBUS_DOCKER_VOLUMES_FROM: visionai-orchestrator
  NIMBUS_DOCKER_NETWORK: nimbus-framework-go_default
  NIMBUS_FIFTYONE_API_URL: http://fiftyone:5152
  NIMBUS_FIFTYONE_PUBLIC_URL: http://${VISIONAI_PUBLIC_HOST:-localhost}:25151
  NIMBUS_FIFTYONE_MEDIA_HOST: host.docker.internal:29000
  NIMBUS_CLEARML_API_URL: http://clearml-apiserver:8008
  NIMBUS_CLEARML_WEB_URL: http://${VISIONAI_PUBLIC_HOST:-localhost}:8080
  NIMBUS_CLEARML_ACCESS_KEY: ${NIMBUS_CLEARML_ACCESS_KEY:-visionai-clearml-api-key}
  NIMBUS_CLEARML_SECRET_KEY: ${NIMBUS_CLEARML_SECRET_KEY:-visionai-clearml-api-secret-development}
  NIMBUS_INFERENCE_API_URL: http://inference:8000
  NIMBUS_INFERENCE_PUBLIC_URL: http://${VISIONAI_PUBLIC_HOST:-localhost}:28000
  NIMBUS_JWT_SECRET: ${NIMBUS_JWT_SECRET:-visionai-local-development-secret}
  NIMBUS_BOOTSTRAP_TENANT: ${NIMBUS_BOOTSTRAP_TENANT:-Nimbus Framework}
  NIMBUS_BOOTSTRAP_USERNAME: ${NIMBUS_BOOTSTRAP_USERNAME:-admin}
  NIMBUS_BOOTSTRAP_PASSWORD: ${NIMBUS_BOOTSTRAP_PASSWORD:-admin123}

services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    image: visionai/backend:latest
    container_name: visionai-backend
    environment:
      <<: *visionai-app-env
    ports:
      - "58080:58080"
    volumes:
      - visionai-imports:/imports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      cvat-bootstrap:
        condition: service_completed_successfully
      fiftyone:
        condition: service_healthy
      inference:
        condition: service_healthy
    networks:
      - default
      - visionai-cvat
    labels:
      traefik.enable: "true"
      traefik.docker.network: visionai-cvat
      traefik.http.services.visionai-cvat-sso.loadbalancer.server.port: "58080"
      traefik.http.routers.visionai-cvat-sso.rule: "PathPrefix(`/admin-api/ai-platform/workbench-sso/cvat`)"
      traefik.http.routers.visionai-cvat-sso.entrypoints: web
      traefik.http.routers.visionai-cvat-sso.priority: 200
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    image: visionai/backend:latest
    container_name: visionai-orchestrator
    entrypoint: ["/app/visionai-orchestrator"]
    environment:
      <<: *visionai-app-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - visionai-imports:/imports
      - visionai-training-work:/training-work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - visionai-cvat
    healthcheck:
      test: ["CMD-SHELL", "pgrep visionai-orchestrator >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    image: visionai/frontend:latest
    container_name: visionai-frontend
    ports:
      - "48080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: nimbus-go-mysql
    environment:
      MYSQL_DATABASE: nimbus_platform_go
      MYSQL_USER: nimbus
      MYSQL_PASSWORD: nimbus_dev
      MYSQL_ROOT_PASSWORD: nimbus_root_dev
      TZ: Asia/Shanghai
    ports:
      - "23316:3306"
    volumes:
      - nimbus-go-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u nimbus -pnimbus_dev --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: nimbus-go-redis
    ports:
      - "27316:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    container_name: visionai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: visionai
      RABBITMQ_DEFAULT_PASS: visionai_dev
    ports:
      - "25672:5672"
      - "25673:15672"
    volumes:
      - visionai-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio:
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    image: visionai/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: visionai-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: visionai
      MINIO_ROOT_PASSWORD: visionai_minio_dev
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - visionai-minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  trainer-smoke:
    build:
      context: .
      dockerfile: deploy/trainer-smoke/Dockerfile
    image: visionai/trainer-smoke:v1
    container_name: visionai-trainer-runtime
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  trainer-gpu:
    build:
      context: .
      dockerfile: deploy/trainer-gpu/Dockerfile
    image: visionai/trainer-gpu:cuda12.6
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  fiftyone:
    build:
      context: .
      dockerfile: deploy/fiftyone/Dockerfile
    image: visionai/fiftyone:1.15.0
    container_name: visionai-fiftyone
    ports:
      - "25152:5152"
    volumes:
      - visionai-fiftyone:/fiftyone
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FIFTYONE_MEDIA_ENDPOINT: host.docker.internal:29000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5151', timeout=3); urllib.request.urlopen('http://127.0.0.1:5152/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  fiftyone-gateway:
    image: nginx:1.27-alpine
    container_name: visionai-fiftyone-gateway
    ports:
      - "25151:8080"
    environment:
      VISIONAI_FRAME_ANCESTORS: "'self' http://localhost:48080 http://127.0.0.1:48080 ${VISIONAI_WORKBENCH_ORIGIN:-http://localhost:48080} http://${VISIONAI_PUBLIC_HOST:-localhost}:48080"
    command:
      - /bin/sh
      - -c
      - envsubst '$$VISIONAI_FRAME_ANCESTORS' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'
    volumes:
      - ./deploy/fiftyone-gateway/nginx.conf:/etc/nginx/nginx.conf.template:ro
    depends_on:
      fiftyone:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  inference:
    build:
      context: .
      dockerfile: deploy/inference/Dockerfile
    image: visionai/inference:2.0.0
    container_name: visionai-inference
    environment:
      VISIONAI_INFERENCE_DEVICE: cuda
      VISIONAI_S3_ENDPOINT: minio:9000
      VISIONAI_S3_ACCESS_KEY: visionai
      VISIONAI_S3_SECRET_KEY: visionai_minio_dev
      VISIONAI_S3_SECURE: "false"
    ports:
      - "28000:8000"
    volumes:
      - visionai-inference-state:/state
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cvat-db:
    image: postgres:15-alpine
    container_name: visionai-cvat-db
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: cvat
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - visionai-cvat-db:/var/lib/postgresql/data
    networks:
      - visionai-cvat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d cvat"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cvat-redis-inmem:
    image: redis:7.2.11-alpine
    container_name: visionai-cvat-redis-inmem
    command: ["redis-server", "--save", "60", "100", "--appendonly", "yes"]
    volumes:
      - visionai-cvat-redis-inmem:/data
    networks:
      - visionai-cvat
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cvat-redis-ondisk:
    image: apache/kvrocks:2.15.0
    container_name: visionai-cvat-redis-ondisk
    init: true
    command: ["--compact-cron", "0 3 * * *"]
    volumes:
      - visionai-cvat-cache:/var/lib/kvrocks
    networks:
      - visionai-cvat
    restart: unless-stopped

  cvat-opa:
    image: openpolicyagent/opa:1.12.2
    container_name: visionai-cvat-opa
    command:
      - run
      - --server
      - --addr=:8181
      - --log-level=error
      - --set=services.cvat.url=http://cvat-server:8080
      - --set=bundles.cvat.service=cvat
      - --set=bundles.cvat.resource=/api/auth/rules
      - --set=bundles.cvat.polling.min_delay_seconds=5
      - --set=bundles.cvat.polling.max_delay_seconds=15
    networks:
      visionai-cvat:
        aliases:
          - opa
    healthcheck:
      test: ["CMD", "/opa", "eval", "true"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cvat-server:
    image: cvat/server:v2.61.0
    container_name: visionai-cvat-server
    command: init run server nginx
    depends_on:
      cvat-db:
        condition: service_started
      cvat-redis-inmem:
        condition: service_started
      cvat-redis-ondisk:
        condition: service_started
      cvat-opa:
        condition: service_started
    environment:
      <<: *cvat-backend-env
      DJANGO_MODWSGI_EXTRA_ARGS: ""
      ALLOWED_HOSTS: "*"
      ADAPTIVE_AUTO_ANNOTATION: "false"
      NUMPROCS: 2
      ONE_RUNNING_JOB_IN_QUEUE_PER_USER: "false"
    labels:
      traefik.enable: "true"
      traefik.http.services.cvat-api.loadbalancer.server.port: "8080"
      traefik.http.routers.cvat-api.rule: "PathPrefix(`/api/`) || PathPrefix(`/static/`) || PathPrefix(`/admin`) || PathPrefix(`/django-rq`)"
      traefik.http.routers.cvat-api.entrypoints: web
      traefik.http.routers.cvat-api.middlewares: cvat-visionai-embed
      traefik.http.middlewares.cvat-visionai-embed.headers.customresponseheaders.X-Frame-Options: ""
      traefik.http.middlewares.cvat-visionai-embed.headers.contentsecuritypolicy: "frame-ancestors 'self' http://localhost:48080 http://127.0.0.1:48080 ${VISIONAI_WORKBENCH_ORIGIN:-http://localhost:48080} http://${VISIONAI_PUBLIC_HOST:-localhost}:48080"
    volumes:
      - visionai-cvat-data:/home/django/data
      - visionai-cvat-keys:/home/django/keys
      - visionai-cvat-logs:/home/django/logs
    healthcheck:
      test: ["CMD-SHELL", "python manage.py health_check >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    networks:
      visionai-cvat:
        aliases:
          - cvat-server
    restart: unless-stopped

  cvat-worker-utils:
    <<: *cvat-worker
    container_name: visionai-cvat-worker-utils
    command: run worker notifications cleaning

  cvat-worker-import:
    <<: *cvat-worker
    container_name: visionai-cvat-worker-import
    command: run worker import

  cvat-worker-export:
    <<: *cvat-worker
    container_name: visionai-cvat-worker-export
    command: run worker export

  cvat-worker-annotation:
    <<: *cvat-worker
    container_name: visionai-cvat-worker-annotation
    command: run worker annotation

  cvat-worker-chunks:
    <<: *cvat-worker
    container_name: visionai-cvat-worker-chunks
    command: run worker chunks

  cvat-ui:
    image: cvat/ui:v2.61.0
    container_name: visionai-cvat-ui
    depends_on:
      - cvat-server
    labels:
      traefik.enable: "true"
      traefik.http.services.cvat-ui.loadbalancer.server.port: "8000"
      traefik.http.routers.cvat-ui.rule: "PathPrefix(`/`)"
      traefik.http.routers.cvat-ui.entrypoints: web
      traefik.http.routers.cvat-ui.priority: 1
      traefik.http.routers.cvat-ui.middlewares: cvat-visionai-embed
    networks:
      - visionai-cvat
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cvat-gateway:
    image: traefik:v3.6
    container_name: visionai-cvat-gateway
    ports:
      - "28080:8080"
    environment:
      TRAEFIK_ENTRYPOINTS_web_ADDRESS: ":8080"
      TRAEFIK_PING: "true"
      TRAEFIK_PING_ENTRYPOINT: web
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: visionai-cvat
      TRAEFIK_LOG_LEVEL: WARN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - visionai-cvat
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cvat-bootstrap:
    image: cvat/server:v2.61.0
    container_name: visionai-cvat-bootstrap
    depends_on:
      cvat-server:
        condition: service_healthy
    environment:
      <<: *cvat-backend-env
      CVAT_BOOTSTRAP_USERNAME: ${CVAT_BOOTSTRAP_USERNAME:-visionai}
      CVAT_BOOTSTRAP_PASSWORD: ${CVAT_BOOTSTRAP_PASSWORD:-visionai_cvat_dev}
      CVAT_BOOTSTRAP_EMAIL: ${CVAT_BOOTSTRAP_EMAIL:-visionai@localhost}
    command:
      - bash
      - -ec
      - >
        python manage.py shell -c "import os;
        from django.contrib.auth import get_user_model;
        U=get_user_model();
        u,created=U.objects.get_or_create(username=os.environ['CVAT_BOOTSTRAP_USERNAME'],
        defaults={'email':os.environ['CVAT_BOOTSTRAP_EMAIL'],'is_staff':True,'is_superuser':True});
        u.is_staff=True; u.is_superuser=True; u.set_password(os.environ['CVAT_BOOTSTRAP_PASSWORD']); u.save();
        print('created' if created else 'updated')"
    volumes:
      - visionai-cvat-data:/home/django/data
      - visionai-cvat-keys:/home/django/keys
      - visionai-cvat-logs:/home/django/logs
    networks:
      - visionai-cvat
    restart: "no"

  clearml-elasticsearch:
    image: elasticsearch:8.19.9
    container_name: visionai-clearml-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "true"
      cluster.name: visionai-clearml
      node.name: visionai-clearml
      cluster.routing.allocation.disk.watermark.low: 500mb
      cluster.routing.allocation.disk.watermark.high: 500mb
      cluster.routing.allocation.disk.watermark.flood_stage: 500mb
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - visionai-clearml-elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 45s
    restart: unless-stopped

  clearml-mongo:
    image: mongo:8.0.15
    container_name: visionai-clearml-mongo
    command: --setParameter internalQueryMaxBlockingSortMemoryUsageBytes=196100200
    volumes:
      - visionai-clearml-mongo:/data/db
      - visionai-clearml-mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  clearml-redis:
    image: redis:8.2.3
    container_name: visionai-clearml-redis
    volumes:
      - visionai-clearml-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  clearml-fileserver:
    image: clearml/server:2.4.0
    container_name: visionai-clearml-fileserver
    command: fileserver
    environment:
      CLEARML__fileserver__delete__allow_batch: "true"
      CLEARML__fileserver__auth__enabled: "false"
    ports:
      - "8081:8081"
    volumes:
      - visionai-clearml-files:/mnt/fileserver
      - visionai-clearml-logs:/var/log/clearml
    networks:
      default:
        aliases:
          - fileserver
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  clearml-apiserver:
    image: clearml/server:2.4.0
    container_name: visionai-clearml-apiserver
    command: apiserver
    environment:
      CLEARML_ELASTIC_SERVICE_HOST: clearml-elasticsearch
      CLEARML_ELASTIC_SERVICE_PORT: "9200"
      CLEARML_MONGODB_SERVICE_HOST: clearml-mongo
      CLEARML_MONGODB_SERVICE_PORT: "27017"
      CLEARML_REDIS_SERVICE_HOST: clearml-redis
      CLEARML_REDIS_SERVICE_PORT: "6379"
      CLEARML_SERVER_DEPLOYMENT_TYPE: docker
      CLEARML__apiserver__pre_populate__enabled: "true"
      CLEARML__apiserver__pre_populate__zip_files: /opt/clearml/db-pre-populate
      CLEARML__apiserver__pre_populate__artifacts_path: /mnt/fileserver
      CLEARML__secure__credentials__apiserver__user_key: ${NIMBUS_CLEARML_ACCESS_KEY:-visionai-clearml-api-key}
      CLEARML__secure__credentials__apiserver__user_secret: ${NIMBUS_CLEARML_SECRET_KEY:-visionai-clearml-api-secret-development}
      CLEARML__secure__credentials__webserver__user_key: visionai-clearml-web-key
      CLEARML__secure__credentials__webserver__user_secret: visionai-clearml-web-secret-development
      CLEARML__secure__http__session_secret__apiserver: visionai-clearml-session-secret-development
      CLEARML__secure__auth__token_secret: visionai-clearml-token-secret-development
    ports:
      - "8008:8008"
    volumes:
      - visionai-clearml-files:/mnt/fileserver
      - visionai-clearml-logs:/var/log/clearml
      - ./deploy/clearml/apiserver.conf:/opt/clearml/config/apiserver.conf:ro
    networks:
      default:
        aliases:
          - apiserver
    depends_on:
      clearml-elasticsearch:
        condition: service_healthy
      clearml-mongo:
        condition: service_healthy
      clearml-redis:
        condition: service_healthy
      clearml-fileserver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/debug.ping', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 45s
    restart: unless-stopped

  clearml-webserver:
    image: clearml/server:2.4.0
    container_name: visionai-clearml-webserver
    command: webserver
    environment:
      CLEARML_API_HOST: http://${VISIONAI_PUBLIC_HOST:-localhost}:8008
      CLEARML_FILES_HOST: http://${VISIONAI_PUBLIC_HOST:-localhost}:8081
    ports:
      - "8080:80"
    depends_on:
      clearml-apiserver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  clearml-agent-gpu:
    build:
      context: .
      dockerfile: deploy/clearml-agent/Dockerfile
    image: visionai/clearml-agent:3.0.3
    container_name: visionai-clearml-agent-gpu
    command:
      - daemon
      - --queue
      - gpu-local
      - --create-queue
      - --docker
      - --force-current-version
      - --foreground
      - --gpus
      - all
    environment:
      CLEARML_API_HOST: http://clearml-apiserver:8008
      CLEARML_WEB_HOST: http://clearml-webserver
      CLEARML_FILES_HOST: http://clearml-fileserver:8081
      CLEARML_API_ACCESS_KEY: ${NIMBUS_CLEARML_ACCESS_KEY:-visionai-clearml-api-key}
      CLEARML_API_SECRET_KEY: ${NIMBUS_CLEARML_SECRET_KEY:-visionai-clearml-api-secret-development}
      CLEARML_WORKER_ID: visionai-clearml-gpu-rtx3060
      CLEARML_AGENT_TEMP_STDOUT_FILE_DIR: /var/lib/docker/volumes/nimbus-framework-go_visionai-training-work/_data/clearml-agent
      TMPDIR: /var/lib/docker/volumes/nimbus-framework-go_visionai-training-work/_data/clearml-agent
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - visionai-clearml-agent-cache:/root/.clearml
      - visionai-training-work:/var/lib/docker/volumes/nimbus-framework-go_visionai-training-work/_data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      clearml-apiserver:
        condition: service_healthy
    restart: unless-stopped

  clearml-agent-cpu:
    build:
      context: .
      dockerfile: deploy/clearml-agent/Dockerfile
    image: visionai/clearml-agent:3.0.3
    container_name: visionai-clearml-agent-cpu
    command:
      - daemon
      - --queue
      - cpu-local
      - --create-queue
      - --docker
      - --force-current-version
      - --foreground
      - --cpu-only
    environment:
      CLEARML_API_HOST: http://clearml-apiserver:8008
      CLEARML_WEB_HOST: http://clearml-webserver
      CLEARML_FILES_HOST: http://clearml-fileserver:8081
      CLEARML_API_ACCESS_KEY: ${NIMBUS_CLEARML_ACCESS_KEY:-visionai-clearml-api-key}
      CLEARML_API_SECRET_KEY: ${NIMBUS_CLEARML_SECRET_KEY:-visionai-clearml-api-secret-development}
      CLEARML_WORKER_ID: visionai-clearml-cpu
      CLEARML_AGENT_TEMP_STDOUT_FILE_DIR: /var/lib/docker/volumes/nimbus-framework-go_visionai-training-work/_data/clearml-agent
      TMPDIR: /var/lib/docker/volumes/nimbus-framework-go_visionai-training-work/_data/clearml-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - visionai-clearml-agent-cache:/root/.clearml
      - visionai-training-work:/var/lib/docker/volumes/nimbus-framework-go_visionai-training-work/_data
    depends_on:
      clearml-apiserver:
        condition: service_healthy
    restart: unless-stopped

